#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
# this synth have many compatibility modes: QS300, TG300B, XG, GM
deviceName: "CS2x"
brand: "Yamaha"
presetFormat: BANK_MSB_LSB_PRG
presetNaming: STANDARD
macros:
  - "XG Mode()              : -- : F0 43 11 4C 00 00 7E 00 F7"
  - "GM Mode()              : -- : F0 7E 7F 09 01 F7"
  # Native Dump Request (see table 2-1 in official manual)
  - "NativeRequest(addr)    : -- : F0432063 addr F7"
  - "SYSTEM()               : 25 : NativeRequest( 50 00 00 )"
  - "Cur Perf Common()      : 3F : NativeRequest( 60 00 00 )"
  - "Cur Perf Common FX()   : 22 : NativeRequest( 60 00 40 )"
  - "Cur Perf Common CC()   : 14 : NativeRequest( 60 00 60 )"
  # layer in [1-4] not [0-3]
  - "Cur Perf Layer(layer)  : 38 : NativeRequest( 60 layer 00 )"
  - "Cur Perf Layers()   : Cur Perf Layer([01-04])"
  - "User Perf Common(perf) : 3F : NativeRequest( 70 perf 00 )"
  - "User Perf Layer1(perf) : 38 : NativeRequest( 71 perf 00 )"
  - "User Perf Layer2(perf) : 38 : NativeRequest( 72 perf 00 )"
  - "User Perf Layer3(perf) : 38 : NativeRequest( 73 perf 00 )"
  - "User Perf Layer4(perf) : 38 : NativeRequest( 74 perf 00 )"
  - "User Perfs(perf) : User Perf Common(perf);User Perf Layer1(perf);User Perf Layer2(perf);User Perf Layer3(perf);User Perf Layer4(perf)"
  - "All User Perfs() : User Perfs([00-127])"
  - "NativeEverything(): SYSTEM();CurrentPerformance();All User Perfs()"
  - "PerformanceName() : Cur Perf Common() : PerformanceMapper"
  - "CurrentPerformance(): Cur Perf Common();Cur Perf Common FX();Cur Perf Common CC();Cur Perf Layers()"
  # "MIDI Data Table <2-2>" in the manual,Parameter Change CS2X SYSTEM
  # mode = $03 PFM
  # mode = $01 XG 
  # mode = $00 General MIDI (TG300B)  
  - "NativeUpdate(addr,value)    : F0431063 addr value F7"
  - "setMode(mode)               : NativeUpdate( $500006 , mode)"
  - "setPerformanceMode()        : setMode($03)"
  - "setXGMode()                 : setMode($01)"
  - "setGMMode()                 : setMode($00)"
  # XG Dump Request (must be in XG mode)
  - "XGRequest(addr)      : -- : F043204C addr F7"
  - "XG SYSTEM()          : 12 : XGRequest( $000000 )"
  - "XG INFORMATION()     : 1B : XGRequest( $010000 )"
  - "XG MULTI EFFECT()    : 19 : XGRequest( $020100 )"
  - "XG MULTI PART(part)  : 34 : XGRequest( 08 part 00 )"
  - "XG MULTI PARTS()     : XG MULTI PART([00-15])"
  # Midi data table <1-6>
  # Note is in [05 - 5B]
  - "XG DRUM Setup 1(note) : 1B : XGRequest( 30 note 00 )"
  - "XG DRUM Setup 2(note) : 1B : XGRequest( 31 note 00 )"
  - "XG DRUM Setups 1()   : XG DRUM Setup 1([05-91])"
  - "XG DRUM Setups 2()   : XG DRUM Setup 2([05-91])"
  - "XGEveryting(): XG SYSTEM();XG MULTI EFFECT();XG MULTI PARTS();XG DRUM Setups 1();XG DRUM Setups 2()"
  - "XG Multi Part Data(part) : XGRequest( 08 part 00 ) : XGPartMapper"
  # XG updates
  - "XGUpdate(addr,value) : -- : F043104C addr value F7"

#
# Banks are listed in manual page 37
# Categories found in manual page 24
#
deviceModes:
  Performance:
    command: setPerformanceMode()
    backupCommand: CurrentPerformance()
    queryName: PerformanceName()
    midiChannels: 0
    banks:
      "Performances 1":
        # 63 64
        command: $3F40
        presetDomain: 0-127
      "Performances 2":
        # 63 66
        command: $3F42
        presetDomain: 0-127
      "User Performance 1":
        # 63 64
        command: $3F41
        presetDomain: 0-127
      "User Performance 2":
        # 63 67
        command: $3F43
        presetDomain: 0-127
    categories:
      - "Not specified"
      - "Piano"
      - "Chromatic Percussion"
      - "Organ"
      - "Guitar"
      - "Bass"
      - "Strings"
      - "Ensemble"
      - "Brass"
