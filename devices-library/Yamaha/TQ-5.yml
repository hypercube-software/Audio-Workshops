#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
# This unit use battery CR2450
deviceName: "TQ-5"
brand: "Yamaha"
presetFormat: SYSEX_PRG
presetNaming: STANDARD
macros:
  - "VMEM()   : 1008 : F0 43 20 04 F7"                 # Voice Memory Bulk
  - "PMEM()   : 0992 : F0 43 20 7E 'LM  8976PM' F7"    # ----
  - "SCED()   : 008E : F0 43 20 7E 'LM  8976AE' F7"    # ACED + VCED Edit buffer
  - "ACED2()  : 00AA : F0 43 20 7E 'LM  8023AE' F7"    # ACED2 + ACED + VCED
  - "SYSTEM() : 008B : F0 43 20 7E 'LM  8036S ' F7"    # EFEDS + SYSTEM SETUP

  - "Everything()                      : SYSTEM();VMEM();PMEM();SCED();ACED2();"

  - "PatchName()                       : SCED() : YamahaVoiceMapper"
  - "Remote_CTRL(param,value)          : F0 43 10 24 param value F7"
  - "Remote_CTRL_ON(param)             : Remote_CTRL(param,7F)"
  - "Remote_CTRL_OFF(param)            : Remote_CTRL(param,00)"
  - "Select_Preset()                   : Remote_CTRL_ON(116)"
  - "Select_User()                     : Remote_CTRL_ON(117)"
  - "Select_Card()                     : Remote_CTRL_ON(118)"

categories:
  - "Drum"
  - "Keyboard: Piano, Rhode,Grand, Pno, EP"
  - "Chromatic Percussion: Clav, Marimba, Bell, Vibe, Celst,Pluck,Celeste"
  - "Organ: Organ, Church, Pipe"
  - "Guitar: Gtr,Strat,Overdrive,Nylon,Steel,Guit"
  - "Bass: Fretless, Bass, Slap"
  - "String: Pizz, Marcato, String, Harp, Alto, Strg"
  - "Brass: Bras, Trumpet, Horn, Trombone,Sax, Tpts,Brs"
  - "Woodwinds: Flute,Ocarina,Pan,Harmon,Whistle,Wind,Flt"
  - "Synth Pad: Pad"
  - "Synth Lead: Lead, Sweep"
  - "Voice: Ahh, Ohh, Vox,Vocal,Choir"

deviceModes:
  Multi:
    queryName: PatchName()
    midiChannels: 0-7
    banks:
      "Internal":
        command: Select_Preset()
        presetDomain: 0-99
      "User":
        command: Select_User()
        presetDomain: 0-99


#
# Mappers to extract patch names
#
mappers:
  YamahaVoiceMapper:
    fields:
      name:
        type: STRING
        offset: $7C
        size: 10
  YamahaPerformanceMapper:
    fields:
      name:
        type: STRING
        offset: $74
        size: 10

controllers:
  - "01   | Modulation  | CC           | 0 | 127"
  - "0B   | Expression  | CC           | 0 | 127"
  - "40   | Sustain     | CC           | 0 | 127"       
