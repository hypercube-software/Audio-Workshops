#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
deviceName: "S4 Plus"
brand: "Alesis"
presetFormat: BANK_MSB_PRG
presetNaming: STANDARD
macros:
  - "PatchName()             :       : F0 00 00 0E 0E 03 00 F7 : AlesisProgramMapper"
  - "NewMixDumpRequest()     :       : F0 00 00 0E 0E 0F 64 F7 : AlesisMixMapper"
  - "ModeSelect(mode)        :       : F0 00 00 0E 0E 0D mode F7"
  - "selectMix(bank,mix)     :       : B0 00 bank ; C0 mix 00 ; F0 00 00 0E 0E 0F 64 F7"
  - "selectUserMix(bank,mix) :       : B0 00 bank ; C0 mix 00 ; F0 00 00 0E 0E 0E mix F7"
  - "selectUserProgram(bank,prg) :   : B0 00 bank ; C0 prg 00"
  - "prgSl(mode) : F0 00 00 0E 0E 10 00 05 00 mode F7"
  - "prgSlON() : prgSl($01)"
  - "mixSlON() : prgSl($02)"
  - "setModeProgram() : ModeSelect( $00 ) ; prgSlON()"
  - "setModeMix() : ModeSelect( $01 ) ; mixSlON()"

decodingKey:
  start: 7
  end: 1
  key:
    - 0 A6 A5 A4 A3 A2 A1 A0
    - 0 B5 B4 B3 B2 B1 B0 A7
    - 0 C4 C3 C2 C1 C0 B7 B6
    - 0 D3 D2 D1 D0 C7 C6 C5
    - 0 E2 E1 E0 D7 D6 D5 D4
    - 0 F1 F0 E7 E6 E5 E4 E3
    - 0 G0 F7 F6 F5 F4 F3 F2
    - 0 G7 G6 G5 G4 G3 G2 G1
#
# Banks are listed in manual page 23
# See reference manual page 115 for categories
# NOTE: Quadrasynth needs to be in GM Mode OFF to accept "SelectBank" messages
#
deviceModes:
  Program:
    command: setModeProgram()
    queryName: PatchName()
    midiChannels: 0
    banks:
      "User Bank":
        command: 0
        presetDomain: 0-127
      "Bank 1":
        command: 1
        presetDomain: 0-127
      "Bank 2":
        command: 2
        presetDomain: 0-127
      "Bank 3":
        command: 3
        presetDomain: 0-127
      "Bank 4":
        command: 4
        presetDomain: 0-127

    categories:
      - "Piano"
      - "Organ"
      - "Chromatic Percussion"
      - "Synth"
      - "Waves"
      - "Bass"
      - "Guitar"
      - "Brass"
      - "Woodwinds"
      - "String"
      - "Ensemble"
      - "Ethnic"
      - "Voice"
      - "Sound FX"
      - "Drums"
      - "Percussions"

  Mix:
    command: setModeMix()
    queryName: NewMixDumpRequest()
    midiChannels: 0-15
    banks:
      "User Bank":
        command: 0
        presetDomain: 0-99
      "Bank 1":
        command: 1
        presetDomain: 0-99
      "Bank 2":
        command: 2
        presetDomain: 0-99
      "Bank 3":
        command: 3
        presetDomain: 0-99
      "Bank 4 (GM)":
        command: 4
        presetDomain: 0-99

#
# Mappers to extract patch names
#
mappers:
  AlesisProgramMapper:
    fields:
      name:
        type: ALESIS_STRING
        unit: BIT
        offset: 8
        size: 10
      # few notes about Alesis categories: There is one per sample, so 4 per program
      # Here we just peek the first one and use it as the program category
      # It is most of the time enough but can be wrong sometimes (like a pad based on a piano sample)
      category:
        type: CATEGORY
        unit: BIT
        lsbFirst: true
        offset: 81 # offset is in bits, we read the "Sample group" as explained in the spec
        size: 6
  AlesisMixMapper:
    fields:
      name:
        type: ALESIS_STRING
        unit: BIT
        offset: 5
        size: 10

controllers:
  - "01   | Modulation   | CC         | 0 | 127"
  - "0B   | Expression   | CC         | 0 | 127"
  - "40   | Sustain      | CC         | 0 | 127" 
