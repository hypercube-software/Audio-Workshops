#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
deviceName: "SE-02"
brand: "Roland"
presetFormat: BANK_MSB_LSB_PRG
presetNaming: STANDARD
macros:
  # Queries
  # https://forum.electra.one/t/preset-roland-se-02-v2/1180/12
  - "System Common()       : 12 : F041100000004411 00000000 00000004 CK8 F7"
  - "CurrentPatch()        : 3E : F041100000004411 05000140 00000030 CK8 F7"
  - "CurrentPatchData()    : 4E : F041100000004411 05000100 00000040 CK8 F7"
  - "PatchName()           : CurrentPatch() : RolandPatchMapper"
deviceModes:
  Single:
    queryName: PatchName()
    midiChannels: 0    
    banks:
      "Bank A":
        command: "$0000"
        presetDomain: 0-127
      "Bank B":
        command: "$0100"
        presetDomain: 0-127
      "Bank C":
        command: "$0200"
        presetDomain: 0-127
      "User Bank":
        command: "$0300"
        presetDomain: 0-127

#
# Mappers to extract patch names
#
mappers:
  RolandPatchMapper:
    fields:
      name:
        type: STRING
        offset: 28
        size: 14

controllers:
  - "01                     | Modulation   | CC    | 0 | 127"
  - "0B                     | Expression   | CC    | 0 | 127"
  - "40                     | Sustain      | CC    | 0 | 127"
  - "66                     | Filter Freq  | CC    | 0 | 127"
  - "68                     | Filter Res   | CC    | 0 | 127"