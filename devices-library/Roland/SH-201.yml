#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
deviceName: "SH-201"
brand: "Roland"
presetFormat: BANK_MSB_LSB_PRG
presetNaming: STANDARD
macros:
  # Queries
  - "System Common()       : 2E : F0417F00001611 00000000 00000021 CK8 F7"
  - "CurrentPatch()        : 2E : F0417F00001611 10000000 00000021 CK8 F7"
  - "PatchName()           : CurrentPatch() : RolandPatchMapper"

deviceModes:
  Single:
    queryName: PatchName()
    midiChannels: 0    
    banks:
      "Internal Bank":
        command: "$5740"
        presetDomain: 0-31
      "User Bank":
        command: "$5700"
        presetDomain: 0-31

#
# Mappers to extract patch names
#
mappers:
  RolandPatchMapper:
    fields:
      name:
        type: STRING
        offset: 11
        size: 12

controllers:
  - "01                     | Modulation   | CC    | 0 | 127"
  - "0B                     | Expression   | CC    | 0 | 127"
  - "40                     | Sustain      | CC    | 0 | 127"
  - "66                     | Filter Freq  | CC    | 0 | 127"
  - "68                     | Filter Res   | CC    | 0 | 127"