#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
deviceName: "Radias"
brand: "Korg"
presetFormat: BANK_MSB_LSB_PRG
presetNaming: STANDARD
macros:
  - "GLOBAL DATA()                   : 00543 : F042303B 0E 00 F7"


#
# Banks are listed in manual page 37
#
deviceModes:
  Program:
    midiChannels: 0
    banks:
      "Program Bank A":
        command: "$0000"
        presetDomain: 0-127
      "Program Bank B":
        command: "$0001"
        presetDomain: 0-127
      "Program Bank C":
        command: "$0002"
        presetDomain: 0-127
      "Program Bank D":
        command: "$0003"
        presetDomain: 0-127
    categories:
      - Keyboard
      - Organ
      - Mallet
      - Bell
      - Strings
      - Vocal/Airy
      - Brass
      - Woodwinds/Reeds
      - Guitar
      - Bass
      - Plucked
      - Synth
      - Synth Lead
      - Motion Synth
      - Sound FX
      - Drums / Perc

  

controllers:
  - "01   | Modulation   | CC         | 0 | 127"
  - "0B   | Expression   | CC         | 0 | 127"
  - "40   | Sustain      | CC         | 0 | 127" 
