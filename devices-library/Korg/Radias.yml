#
# Do NOT edit this file, create a <device-name>-user.yml in the same directory instead
#
deviceName: "Radias"
brand: "Korg"
presetFormat: BANK_MSB_LSB_PRG
presetNaming: STANDARD
macros:
  - "CURRENT PROGRAM DATA()          : 0804 : F0423072 10 F7"
  - "ProgramName() : CURRENT PROGRAM DATA()(): NameMapper"

decodingKey:
  start: 5
  end: 1
  key:
    - 0 G7 F7 E7 D7 C7 B7 A7
    - 0 A6 A5 A4 A3 A2 A1 A0
    - 0 B6 B5 B4 B3 B2 B1 B0
    - 0 C6 C5 C4 C3 C2 C1 C0
    - 0 D6 D5 D4 D3 D2 D1 D0
    - 0 E6 E5 E4 E3 E2 E1 E0
    - 0 F6 F5 F4 F3 F2 F1 F0
    - 0 G6 G5 G4 G3 G2 G1 G0
    
#
# Banks are listed in manual page 37
#
deviceModes:
  Program:
    midiChannels: 0
    queryName: ProgramName()
    banks:
      "Program Bank A":
        command: "$0000"
        presetDomain: 0-127
      "Program Bank B":
        command: "$0001"
        presetDomain: 0-127
      "Program Bank C":
        command: "$0002"
        presetDomain: 0-127
      "Program Bank D":
        command: "$0003"
        presetDomain: 0-127
    categories:
      - Bass
      - Lead
      - Synth Hard
      - Synth Soft
      - Motion
      - Strings/Pad
      - Keyboard
      - Guitar/Pluck
      - Bell/Decay
      - Hit/Run
      - Sound FX
      - Arp/Seq
      - Split
      - Audio In
      - Vocoder
      - User

#
# Mappers to extract patch names
#
mappers:
  NameMapper:
    fields:
      name:
        type: STRING
        offset: 0
        size: 15
      category:
        type: CATEGORY
        offset: 16
        size: 1        

controllers:
  - "01   | Modulation   | CC         | 0 | 127"
  - "0B   | Expression   | CC         | 0 | 127"
  - "40   | Sustain      | CC         | 0 | 127" 
