projectName: "Yamaha-CS2x"
device: CS2x
ports:
  inputAudioDevice: Multichannel (M-Audio ProFire 610)
  outputAudioDevice: Casque (JBL Live 770NC Hands-Free AG Audio)
audio:
  bufferDurationMs: 250
  nbChannels: 2
  channelMapping: "0:0 1:1"
  bitDepth: 16
  sampleRate: 44100
midi:
  # DS: Decent Sampler
  # SFZ
  outputFormats:
    - DS
    - SFZ
  # Loop detector: HARD_CUT (naive, fixed duration), AUTOCORRELATION (time domain) or FREQUENCY_DOMAIN (spectral seam)
  loopDetector: FREQUENCY_DOMAIN
  # detect looping sounds
  maxNoteDurationSec: 6
  maxNoteReleaseDurationSec: 10
  # Default MIDI channel (from 1 to 16)
  channel: 1
  deviceMode: XG
  # lowest preset included (must match a preset name in the device library)
  lowestPreset: SFX Kit 1
  # highest preset included (must match a preset name in the device library)
  highestPreset: SFX Kit 1
  # lowest note included
  lowestNote: C1
  # highest note included
  highestNote: C2
  # how many note to record per octave
  notesPerOctave: 1
  # how many velocity layer to record per note
  velocityPerNote: 2
  # how many CC layer to record per note
  ccPerNote: 1
