projectName: "BOSS-DS330"
device: DS-330
ports:
  inputAudioDevice: "Microphone (Realtek High Definition Audio)"
  outputAudioDevice: "Haut-parleurs (Realtek High Definition Audio)"
audio:
  bufferDurationMs: 250
  nbChannels: 2
  channelMapping: "0:0 1:1"
  bitDepth: 16
  sampleRate: 44100
midi:
  # DS: Decent Sampler
  # SFZ
  outputFormat: DS
  # detect looping sounds
  maxNoteDurationSec: 5
  maxNoteReleaseDurationSec: 5
  # Default MIDI channel (from 1 to 16)
  channel: 1
  # lowest preset included (must match a preset name in the device library)
  lowestPreset: Piano 1
  # highest preset included (must match a preset name in the device library)
  highestPreset: Gun Shot
  # lowest note included
  lowestNote: C1
  # highest note included
  highestNote: C2
  # how many note to record per octave
  notesPerOctave: 2
  # how many velocity layer to record per note
  velocityPerNote: 2
  # how many CC layer to record per note
  ccPerNote: 2
# TODO: drumkitNotes feature commented out - needs to be reimplemented using device library
